<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Engineering Jobs - Esoc</title>
    <style>
        :root {
            --color-bg-base: #0f172a;
            --color-bg-elevated: #020617;
            --color-bg-surface: #1e293b;
            --color-bg-muted: #334155;
            --color-text-primary: #f1f5f9;
            --color-text-secondary: #cbd5e1;
            --color-text-muted: #94a3b8;
            --color-text-accent: #38bdf8;
            --color-primary: #10b981;
            --color-primary-hover: #059669;
            --color-border: rgba(148, 163, 184, 0.2);
            --color-success: #10b981;
            --color-warning: #f59e0b;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --color-bg-base: #ffffff;
                --color-bg-elevated: #f8fafc;
                --color-bg-surface: #f1f5f9;
                --color-bg-muted: #e2e8f0;
                --color-text-primary: #0f172a;
                --color-text-secondary: #475569;
                --color-text-muted: #64748b;
                --color-text-accent: #0284c7;
                --color-primary: #059669;
                --color-primary-hover: #047857;
                --color-border: rgba(15, 23, 42, 0.15);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: var(--color-bg-base);
            color: var(--color-text-primary);
            line-height: 1.6;
        }

        .navbar {
            background: var(--color-bg-surface);
            border-bottom: 1px solid var(--color-border);
            padding: 16px 0;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 600;
            color: var(--color-primary);
            margin: 0;
        }

        .logo p {
            font-size: 14px;
            margin: 0;
            color: var(--color-text-secondary);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--color-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .filters-section {
            background: var(--color-bg-surface);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid var(--color-border);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-secondary);
        }

        input[type="text"],
        input[type="search"],
        select {
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--color-bg-base);
            color: var(--color-text-primary);
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .search-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .job-count {
            color: var(--color-text-secondary);
            font-size: 14px;
        }

        .sort-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .jobs-grid {
            display: grid;
            gap: 20px;
        }

        .job-card {
            background: var(--color-bg-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .job-card:hover {
            border-color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 16px;
        }

        .job-title-section {
            flex: 1;
        }

        .job-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--color-text-primary);
            margin-bottom: 8px;
        }

        .company-name {
            color: var(--color-text-secondary);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .job-location {
            color: var(--color-text-muted);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .company-logo {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: var(--color-bg-base);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 24px;
            color: var(--color-primary);
            border: 1px solid var(--color-border);
            flex-shrink: 0;
        }

        .job-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .job-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .tag {
            padding: 6px 12px;
            background: var(--color-bg-muted);
            border-radius: 6px;
            font-size: 13px;
            color: var(--color-text-secondary);
            border: 1px solid var(--color-border);
        }

        .tag.primary {
            background: rgba(16, 185, 129, 0.15);
            color: var(--color-primary);
            border-color: var(--color-primary);
        }

        .job-description {
            color: var(--color-text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .job-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }

        .posted-date {
            font-size: 13px;
            color: var(--color-text-muted);
        }

        .no-jobs {
            text-align: center;
            padding: 60px 20px;
            color: var(--color-text-muted);
        }

        .no-jobs-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 32px;
        }

        .page-btn {
            padding: 8px 14px;
            border: 1px solid var(--color-border);
            background: var(--color-bg-surface);
            color: var(--color-text-primary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background: var(--color-bg-muted);
        }

        .page-btn.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        @media (max-width: 768px) {
            .filters-grid {
                grid-template-columns: 1fr;
            }

            .job-header {
                flex-direction: column;
            }

            .company-logo {
                align-self: flex-start;
            }

            .stats-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                gap: 12px;
            }
        }
    </style>
</head>

            },
            {
                id: 11,
                title: "SCADA Engineer - Renewable Energy",
                company: "Inox Wind",
                location: "Remote",
                type: "Contract",
                category: "Wind Energy",
                experience: "Mid Level",

                salaryNum: 1600000,
                description: "Develop and maintain SCADA systems for wind farm operations. Program HMI interfaces, configure data acquisition systems, and troubleshoot communication protocols.",
                tags: ["SCADA", "HMI", "PLC", "Communication"],
                posted: "5 days ago",
                datePosted: new Date(Date.now() - 5 * 24 * 60 * 60 * 1000)
            },
            {
                id: 12,
                title: "Nuclear Power Plant Engineer",
                company: "Nuclear Power Corp India",
                location: "On-site",
                type: "Full-time",
                category: "Nuclear Energy",
                experience: "Senior Level",
                salary: "₹20,00,000 - ₹35,00,000/year",
                salaryNum: 2750000,
                description: "Oversee operations and maintenance of nuclear power generation systems. Ensure safety protocols, manage reactor systems, and coordinate with regulatory bodies. Nuclear engineering degree required.",
                tags: ["Nuclear", "Safety", "Reactor Systems", "Compliance"],
                posted: "1 week ago",
                datePosted: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)
            }
        ];

        let filteredJobs = [...jobs];
        let currentPage = 1;
        const jobsPerPage = 6;

        function getCompanyInitials(company) {
            return company.split(' ').map(word => word[0]).join('').substring(0, 2).toUpperCase();
        }

        function renderJobs() {
            const jobsGrid = document.getElementById('jobsGrid');
            const startIdx = (currentPage - 1) * jobsPerPage;
            const endIdx = startIdx + jobsPerPage;
            const jobsToShow = filteredJobs.slice(startIdx, endIdx);

            if (jobsToShow.length === 0) {
                jobsGrid.innerHTML = `
                    <div class="no-jobs">
                        <h3>No jobs found</h3>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            jobsGrid.innerHTML = jobsToShow.map(job => `
                <div class="job-card" onclick="viewJob(${job.id})">
                    <div class="job-header">
                        <div class="job-title-section">
                            <h2 class="job-title">${job.title}</h2>
                            <div class="company-name">${job.company}</div>
                            <div class="job-location">${job.location}</div>
                        </div>
                        <div class="company-logo">${getCompanyInitials(job.company)}</div>
                    </div>
                    
                    <div class="job-meta">
                        <span class="meta-item">${job.type}</span>
                        <span class="meta-item">${job.experience}</span>
                        <span class="meta-item">${job.category}</span>
                    </div>
                    
                    <div class="job-tags">
                        ${job.tags.map((tag, idx) => 
                            `<span class="tag ${idx === 0 ? 'primary' : ''}">${tag}</span>`
                        ).join('')}
                    </div>
                    
                    <p class="job-description">${job.description}</p>
                    
                    <div class="job-footer">
                        <div class="posted-date">Posted ${job.posted}</div>
                    </div>
                </div>
            `).join('');

            updatePagination();
            updateJobCount();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredJobs.length / jobsPerPage);
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let paginationHTML = '';
            
            if (currentPage > 1) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage - 1})">← Prev</button>`;
            }
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    paginationHTML += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    paginationHTML += `<span class="page-btn">...</span>`;
                }
            }
            
            if (currentPage < totalPages) {
                paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage + 1})">Next →</button>`;
            }
            
            pagination.innerHTML = paginationHTML;
        }

        function changePage(page) {
            currentPage = page;
            renderJobs();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateJobCount() {
            document.getElementById('jobCount').textContent = `Showing ${filteredJobs.length} job${filteredJobs.length !== 1 ? 's' : ''}`;
        }

        function filterJobs() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('typeFilter').value;
            const locationFilter = document.getElementById('locationFilter').value;
            const experienceFilter = document.getElementById('experienceFilter').value;
            const categoryFilter = document.getElementById('categoryFilter').value;

            filteredJobs = jobs.filter(job => {
                const matchesSearch = !searchTerm || 
                    job.title.toLowerCase().includes(searchTerm) ||
                    job.company.toLowerCase().includes(searchTerm) ||
                    job.description.toLowerCase().includes(searchTerm) ||
                    job.tags.some(tag => tag.toLowerCase().includes(searchTerm));
                
                const matchesType = !typeFilter || job.type === typeFilter;
                const matchesLocation = !locationFilter || job.location === locationFilter;
                const matchesExperience = !experienceFilter || job.experience === experienceFilter;
                const matchesCategory = !categoryFilter || job.category === categoryFilter;

                return matchesSearch && matchesType && matchesLocation && matchesExperience && matchesCategory;
            });

            currentPage = 1;
            renderJobs();
        }

        function sortJobs() {
            const sortBy = document.getElementById('sortBy').value;

            switch(sortBy) {
                case 'recent':
                    filteredJobs.sort((a, b) => b.datePosted - a.datePosted);
                    break;
                case 'salary-high':
                    filteredJobs.sort((a, b) => b.salaryNum - a.salaryNum);
                    break;
                case 'salary-low':
                    filteredJobs.sort((a, b) => a.salaryNum - b.salaryNum);
                    break;
                case 'title':
                    filteredJobs.sort((a, b) => a.title.localeCompare(b.title));
                    break;
            }

            renderJobs();
        }

        function viewJob(jobId) {
            const job = jobs.find(j => j.id === jobId);
            alert(`Viewing job: ${job.title}\n\nCompany: ${job.company}\nLocation: ${job.location}\nSalary: ${job.salary}\n\nThis would open a detailed job view page with:\n- Full job description\n- Requirements & qualifications\n- Benefits & perks\n- Application form\n\nClick "Apply Now" to submit your application!`);
        }

        document.getElementById('searchInput').addEventListener('input', filterJobs);

        document.getElementById('experienceFilter').addEventListener('change', filterJobs);
        document.getElementById('categoryFilter').addEventListener('change', filterJobs);

        renderJobs();
